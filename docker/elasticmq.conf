include classpath("application.conf")

// Local stand-in for SQS. The AWS queue (Terraform) uses a 300s
// visibility timeout sized for slow Fargate chunks; locally chunks take
// well under a second, so 60s is still generous headroom and keeps the
// kill-a-worker chaos test fast (a killed worker's in-flight message
// redelivers after at most one minute).
queues {
  wealthsim-jobs {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
  }
  // one queue per engine: SQS cannot filter on receive, so Node and Go
  // workers each consume their own queue (mirrors the AWS pair)
  wealthsim-jobs-go {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 0 seconds
  }
}
