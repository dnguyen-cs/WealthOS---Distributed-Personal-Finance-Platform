services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wealthos
      POSTGRES_PASSWORD: wealthos
      POSTGRES_DB: wealthos
    ports:
      # 5434 on the host: native Windows Postgres instances own 5432 and 5433
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthos -d wealthos"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local SQS stand-in (dev-only emulator; AWS provides the real queue)
  queue:
    image: softwaremill/elasticmq-native:latest
    ports:
      - "9324:9324"
    volumes:
      - ./docker/elasticmq.conf:/opt/elasticmq.conf:ro

  # Local S3 stand-in (dev-only emulator; AWS provides the real bucket)
  objectstore:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - objectstore-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      # override localhost from .env with in-network service hosts
      DATABASE_URL: postgresql://wealthos:wealthos@db:5432/wealthos
      REDIS_URL: redis://redis:6379
      SQS_ENDPOINT: http://queue:9324
      WEALTHSIM_QUEUE_URL: http://queue:9324/000000000000/wealthsim-jobs
      WEALTHSIM_QUEUE_URL_GO: http://queue:9324/000000000000/wealthsim-jobs-go
      S3_ENDPOINT: http://objectstore:9000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

  # WealthSim compute worker; scale with: docker compose up -d --scale worker=4 worker
  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    env_file: .env
    environment:
      SQS_ENDPOINT: http://queue:9324
      WEALTHSIM_QUEUE_URL: http://queue:9324/000000000000/wealthsim-jobs
      S3_ENDPOINT: http://objectstore:9000
    depends_on:
      queue:
        condition: service_started
      objectstore:
        condition: service_healthy

  # Go edition of the compute worker, consuming the engine's own queue;
  # scale with: docker compose up -d --scale worker-go=4 worker-go
  worker-go:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker-go
    env_file: .env
    environment:
      SQS_ENDPOINT: http://queue:9324
      WEALTHSIM_QUEUE_URL: http://queue:9324/000000000000/wealthsim-jobs-go
      S3_ENDPOINT: http://objectstore:9000
    depends_on:
      queue:
        condition: service_started
      objectstore:
        condition: service_healthy

volumes:
  db-data:
  objectstore-data:
